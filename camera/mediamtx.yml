# MediaMTX serves the camera to viewers over WebRTC (WHEP, sub-second latency)
# and Low-Latency HLS (fallback, ~2-3 s). Keys left out use MediaMTX defaults:
# https://github.com/bluenviron/mediamtx/blob/v1.11.3/mediamtx.yml

logLevel: info

# Every viewer request is checked against the backend, which decides from the
# ?token= query param (Caddy moves the token there from the URL path).
# MTX_AUTHHTTPADDRESS in docker-compose.yml overrides this for local testing.
authMethod: http
authHTTPAddress: https://kiltiskamera.prodeko.org/authenticate
authHTTPExclude:
  # ffmpeg publishes from inside the container; RTSP is not exposed outside it
  - action: publish
  - action: api
  - action: metrics
  - action: pprof

# Only used internally between ffmpeg and MediaMTX
rtsp: yes
rtspAddress: :8554
protocols: [tcp]
rtmp: no
srt: no

hls: yes
hlsAddress: :8888
hlsAllowOrigin: https://kiltiskamera.prodeko.org
hlsVariant: lowLatency
hlsSegmentCount: 7
# Must be >= the keyframe interval set in the ffmpeg command (-g)
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: https://kiltiskamera.prodeko.org
# Media flows directly to the browser over these ports, not through Caddy.
# UDP is preferred; TCP is the fallback for viewers on networks that block UDP.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Public IP or hostname of the camera network, set with MTX_WEBRTCADDITIONALHOSTS
webrtcAdditionalHosts: []
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

paths:
  cam:
    # Keyframe every second (-g 30 at 30 fps) so HLS segments and WebRTC
    # joins line up. Baseline profile has no B-frames, which WebRTC requires.
    runOnInit: >
      ffmpeg -f v4l2 -i /dev/video0
      -vf "vflip,hflip"
      -c:v libx264 -profile:v baseline -level:v 4.1 -pix_fmt yuv420p
      -preset ultrafast -tune zerolatency
      -b:v 2000k -maxrate 2000k -bufsize 2000k
      -s 1920x1080 -r 30 -g 30 -keyint_min 30 -sc_threshold 0
      -an
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
