services:
  # MediaMTX reads the USB webcam with ffmpeg and serves it over WebRTC and LL-HLS
  mediamtx:
    image: bluenviron/mediamtx:1.11.3-ffmpeg
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    devices:
      - /dev/video0:/dev/video0
    environment:
      # Public IP or hostname viewers reach the camera network at, for WebRTC
      - MTX_WEBRTCADDITIONALHOSTS=${PUBLIC_HOST:-}
    ports:
      # WebRTC media; forward these from the router to this machine
      - "8189:8189/udp"
      - "8189:8189/tcp"
    restart: always

  # The caddy container proxies stream requests to MediaMTX, moving the token from the path to the query
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
