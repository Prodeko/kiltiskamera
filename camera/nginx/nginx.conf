worker_processes  auto;

events {
    worker_connections  1024;
}
 
http { 
    default_type application/octet-stream;

    #access_log off;
    #error_log off;

    # Cache for internal auth checks
    proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m max_size=128m inactive=10m use_temp_path=off;
    # Separate cache for the portal's /feed/ auth checks
    proxy_cache_path /var/cache/nginx/feed_auth levels=1:2 keys_zone=feed_auth_cache:10m max_size=128m inactive=10m use_temp_path=off;

    server { 
        listen 4000;

        location ~ ^/live/hls/(?<token>.*)/(?<file>.*) {
            auth_request /auth;
            add_header 'Access-Control-Allow-Origin' '*' always;

            # Rewrite the request without the token
            alias /var/www/hls/$file;
        }

        location = /auth {
            internal;
            proxy_cache             auth_cache;
            proxy_cache_methods     GET HEAD POST;
            proxy_cache_key         "$cookie_token";
            # Valid tokens cache duration is set by backend returning a properly set Cache-Control header
            # Invalid tokens are shortly cached to protect backend but not flood Nginx cache
            proxy_cache_valid       401 30s;
            # Valid tokens are cached for 30 seconds so we can get the backend to re-validate them from time to time
            proxy_cache_valid       200 30s; 

            #proxy_set_header        Host ........;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Accept application/json;
           
            resolver 127.0.0.11;  # Docker internal DNS resolver for getting the authentication IP
            proxy_pass "https://kiltiskamera.prodeko.org:443/authenticate?token=$token";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_ssl_server_name on;

        }

        # Viewers of the Prodeko portal (same-origin at kiltis.prodeko.org/feed/hls/...).
        # Same HLS files as /live/hls/, but the token is checked by the portal API.
        location ~ ^/feed/hls/(?<token>[A-Za-z0-9_-]+)/(?<file>[^/]+)$ {
            # Copy the path token into a variable the auth subrequest reads
            set $feed_token $token;
            auth_request /feed_auth;

            alias /var/www/hls/$file;
        }

        location = /feed_auth {
            internal;
            proxy_cache             feed_auth_cache;
            proxy_cache_methods     GET HEAD POST;
            # One cache entry per viewer token
            proxy_cache_key         "$feed_token";
            # Used unless the portal sends Cache-Control/Expires
            proxy_cache_valid       200 30s;
            proxy_cache_valid       401 30s;

            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Accept application/json;
            proxy_set_header        X-Original-URI $request_uri;
            # The token alone decides; do not forward viewers' portal cookies
            proxy_set_header        Cookie "";

            resolver 127.0.0.11;  # Docker internal DNS resolver
            proxy_pass "https://kiltis.prodeko.org/api/kamera/authenticate?token=$feed_token";
            proxy_ssl_server_name on;
        }

 
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 m4s;
            text/html html;
        }
    } 
}